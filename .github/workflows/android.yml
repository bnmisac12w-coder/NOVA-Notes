name: NOVA Notes Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle kurulumunu hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug APK oluştur
        run: gradle :app:assembleDebug
      - name: APK dosyasını Actions çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Notes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: GitHub Release oluştur ve APK ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NOVA Notes Android build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
