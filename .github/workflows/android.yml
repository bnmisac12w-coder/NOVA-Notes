name: NOVA Notes Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle kurulumunu hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sürüm numarasını al ve APK oluştur
        id: build
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "NOVA-Notes-$VERSION.apk"
      - name: APK dosyasını Actions çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Notes-${{ steps.build.outputs.version }}
          path: NOVA-Notes-${{ steps.build.outputs.version }}.apk
          if-no-files-found: error
      - name: GitHub Release oluştur ve sürüm isimli APK ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}-build-${{ github.run_number }}
          name: NOVA Notes v${{ steps.build.outputs.version }}
          files: NOVA-Notes-${{ steps.build.outputs.version }}.apk
          fail_on_unmatched_files: true
